# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Security"

on:
  push:
    tags: ["*"]
    branches: ["*"]
  pull_request:
    branches: ["*"]
  schedule:
    - cron: "25 10 * * 3"
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: "ubuntu-latest"
    permissions:
      actions: "read"
      contents: "read"
      security-events: "write"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: "actions", build-mode: "none" }
          - { language: "go", build-mode: "autobuild" }
    steps:
      - name: "Checkout"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"
      - name: "Initialize CodeQL"
        uses: "github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e"
        with:
          languages: "${{ matrix.language }}"
          build-mode: "${{ matrix.build-mode }}"
      - name: "Perform CodeQL Analysis"
        uses: "github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e"
        with:
          category: "/language:${{matrix.language}}"

  govulncheck:
    name: "Analyze (govulncheck)"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      security-events: "write"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10"
      - name: "Get Go version"
        id: "go-version"
        uses: "./.github/actions/go-version"
      - name: "Set up Go"
        uses: "actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c"
        with:
          go-version: "${{ steps.go-version.outputs.version }}"
          check-latest: true
      - name: "Run govulncheck"
        run: |
          { make govulncheck GOVULNCHECK_ARGS="-format sarif" ||:; } | tee ./govulncheck.sarif
      - name: "Upload SARIF"
        if: always()
        uses: "github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e"
        with:
          sarif_file: "./govulncheck.sarif"
          category: "govulncheck"
